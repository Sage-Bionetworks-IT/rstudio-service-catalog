ci:
  autoupdate_schedule: monthly
repos:
  - repo: https://github.com/awslabs/git-secrets
    rev: 7d6b970cbd3c216353cb22b383b70c150140662e  # HEAD ; no recent tags
    hooks:
      - id: git-secrets
        entry: git-secrets
        args: [--scan, --recursive]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0  # v6.0.0
    hooks:
      # On Windows, git will convert all CRLF to LF,
      # but only after all hooks are done executing.
      # yamllint will fail before git has a chance to convert
      # line endings, so it must be explicitly done before yamllint
      - id: mixed-line-ending
        args: ['--fix=lf']
        description: Forces to replace line ending by the UNIX 'LF' character
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-ast
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0  # v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6  # v1.5.6
    hooks:
      - id: remove-tabs
  - repo: https://github.com/sirosen/check-jsonschema
    rev: 0.39.0  # 0.37.3
    hooks:
      - id: check-github-workflows
      - id: check-github-actions
  - repo: https://github.com/pryorda/dockerfilelint-precommit-hooks
    rev: v0.1.0  # v0.1.0
    hooks:
      - id: dockerfilelint
