---
#
# This workflow runs Trivy on a Docker image
# It can pull the image from a container registry
# or download a tar file.  The latter is used
# to check a container image prior to publishing
# to the registry.

name: Run Trivy on a Docker image and push results to GitHub

on:
  workflow_call:
    inputs:
      SOURCE_TYPE:  # 'tar' or 'image'
        required: true
        type: string
      TARFILE_NAME:  # only used if SOURCE_TYPE=='tar'
        required: false
        type: string
      IMAGE_NAME:
        # only used as the scan target when SOURCE_TYPE=='image'; for 'tar', the image
        # reference parsed from `docker load`'s output is used instead (see the
        # 'load docker image from tar file' step below)
        required: true
        type: string
      SARIF_ARTIFACT:
        required: false
        type: string
        default: trivy-results
      CATEGORY:
        # distinguishes this scan's SARIF upload from others for the same ref (e.g. one
        # per architecture) — without it, GitHub Code Scanning treats same-category
        # uploads for the same ref as superseding each other and only the last one wins
        required: false
        type: string
        default: ""
      EXIT_CODE:
        # return code for failed scan. 0 means OK.  Non-zero will fail the build when there are findings.
        required: false
        type: number
        default: 0
    outputs:
      trivy_conclusion:
        description: "The pass/fail status from Trivy"
        value: ${{ jobs.trivy.outputs.trivy_conclusion }}

env:
  sarif_file_name: trivy-results.sarif
  # downloading the trivy-db from its default GitHub location fails because
  # the site experiences too many downloads.  The fix is to pull from this
  # alternate location.
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download tar file
        id: tar-download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.SOURCE_TYPE == 'tar' }}
        with:
          name: ${{ inputs.TARFILE_NAME }}
          path: /tmp

      - name: load docker image from tar file
        id: docker-load
        if: ${{ inputs.SOURCE_TYPE == 'tar' }}
        run: |
          IMAGE_REF=$(docker load -i "${{ steps.tar-download.outputs.download-path }}/${{ inputs.TARFILE_NAME }}" | awk '/Loaded image:/ {print $3}' | tail -n 1)
          if [ -z "$IMAGE_REF" ]; then
            echo "ERROR: Could not parse an image reference from 'docker load' output" >&2
            exit 1
          fi
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Run Trivy vulnerability scanner for any major issues
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        id: trivy
        with:
          image-ref: ${{ inputs.SOURCE_TYPE == 'tar' && steps.docker-load.outputs.image_ref || inputs.IMAGE_NAME }}
          ignore-unfixed: true  # skip vul'ns for which there is no fix
          # list directories to skip, each with a justification:
          # files in webfakes have fake credentials
          #
          # /home/rstudio/.pyenv is not used, instead reticulate creates its own venv
          #
          # Need to skip /home/rstudio/.virtualenvs/r-reticulate/lib/python3.10/site-packages/protobuf-4.25.8.dist-info
          # until SYNPY-1763 is fixed
          #
          skip-dirs: '/usr/local/lib/R/site-library/webfakes/cert/,/home/rstudio/.pyenv,/home/rstudio/.virtualenvs/r-reticulate/lib/python3.10/site-packages/protobuf-4.25.8.dist-info'
          # list files to skip, each with a justification
          # keys.html is a documentation file that appears to contain cred's
          # fake_service_account.json is a fake account that gets flagged as a credentials file
          # Note, the following fails to be recognized correctly if split across multiple lines
          skip-files: '/usr/local/lib/R/site-library/openssl/doc/keys.html,/usr/local/lib/R/site-library/gargle/extdata/fake_service_account.json'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          # only output findings for configured severities
          limit-severities-for-sarif: true
          output: ${{ env.sarif_file_name  }}
          exit-code: ${{ inputs.EXIT_CODE }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        # This is the recommended way to upload scan results
        # after Trivy exits with HIGH/CRITICAL findings
        # See https://github.com/aquasecurity/trivy-action?\
        # tab=readme-ov-file#using-trivy-with-github-code-scanning
        # Note that here instead of using `always()` which would
        # allow the step to run if *any* preceeding step failed,
        # this logic ensures that the step ony runs if all steps
        # succeed or if only  the 'trivy' step fails.
        if: ${{ success() || steps.trivy.conclusion=='failure' }}
        with:
          sarif_file: ${{ env.sarif_file_name  }}
          category: ${{ inputs.CATEGORY }}
          wait-for-processing: true

      # This step captures the Sarif file so we can validate what
      # we see in the Code Scanning tab
      - name: Upload Trivy output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ success() || steps.trivy.conclusion=='failure' }}
        with:
          name: ${{ inputs.SARIF_ARTIFACT  }}
          path: ${{ env.sarif_file_name  }}

    outputs:
      trivy_conclusion: ${{ steps.trivy.conclusion }}
...
